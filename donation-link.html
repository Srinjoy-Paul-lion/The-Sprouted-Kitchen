<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Donate to Our Cause</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6fa;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    h2 {
      text-align: center;
      color: #2a4d69;
    }
    .section {
      margin-top: 30px;
    }
    .qr-code {
      text-align: center;
      margin-top: 20px;
    }
    .qr-code img {
      max-width: 200px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    .donation-links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .donation-links a {
      background: #28a745;
      color: white;
      padding: 12px 20px;
      text-align: center;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .donation-links a:hover {
      background: #218838;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Support Our Mission</h2>
    
    <div class="section">
      <p>You can contribute to our cause using the following options. Every donation helps us bring change to those who need it the most.</p>
    </div>

    <div class="section qr-code">
      <h3>Scan to Pay</h3>
      <img src="C:\Users\hp\OneDrive\Desktop\My ESD and Minor Project\Food Devil's Eye\Food Devil's Eye\qr.jpg" alt="Donate QR Code" />
      <p><em>Scan using UPI apps (e.g., Google Pay, PhonePe, Paytm)</em></p>
    </div>

    <div class="section donation-links">
      <a href="https://www.paypal.com/donate/example" target="_blank">Donate via PayPal</a>
      <a href="https://rzp.io/l/your-link" target="_blank">Donate via Razorpay</a>
      <a href="https://yourwebsite.com/bank-details" target="_blank">Bank Transfer Info</a>
    </div>
  </div>

</body>
</html>
